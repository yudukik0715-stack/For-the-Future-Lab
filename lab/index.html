<title>For the Future Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Obsidian風の3ペイン ― 左にナビ、中央に部屋、右にいつでも話せるチューター */
:root{
  --bg:#10141c; --surface:#171c26; --raised:#1e2431; --line:#2a3242; --ink:#e9ebf0; --sub:#a3abbb; --muted:#78819a;
  --accent:#e9b949; --accent-ink:#1a1405; --hl:rgba(233,185,73,.22);
  --c-paper:#3987e5; --c-news:#d95926; --c-ency:#199e70; --c-note:#c98500;
  --good:#3fb27f; --grid:rgba(163,171,187,.16);
  --f-display:"Shippori Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f2ee; --surface:#fbfaf7; --raised:#ffffff; --line:#e2dfd6; --ink:#1d1f24; --sub:#575b66; --muted:#7f8390;
  --accent:#b07d0c; --accent-ink:#ffffff; --hl:rgba(233,185,73,.35);
  --c-paper:#2a78d6; --c-news:#eb6834; --c-ency:#1baf7a; --c-note:#eda100;
  --good:#1f8a5b; --grid:rgba(87,91,102,.14); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f2ee; --surface:#fbfaf7; --raised:#ffffff; --line:#e2dfd6; --ink:#1d1f24; --sub:#575b66; --muted:#7f8390;
  --accent:#b07d0c; --accent-ink:#ffffff; --hl:rgba(233,185,73,.35);
  --c-paper:#2a78d6; --c-news:#eb6834; --c-ency:#1baf7a; --c-note:#eda100;
  --good:#1f8a5b; --grid:rgba(87,91,102,.14); color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.7}
*{box-sizing:border-box}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 360px;height:100%}
/* nav */
.nav{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.3;margin:0 6px 18px}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--sub)}
.nav a:hover{background:var(--raised);color:var(--ink)}
.nav a.on{background:var(--raised);color:var(--ink);font-weight:700;box-shadow:inset 2px 0 0 var(--accent)}
.nav svg{width:17px;height:17px;flex:none}
.nav .sep{height:1px;background:var(--line);margin:12px 6px}
.nav .tagcloud{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px}
.navfoot{margin-top:auto;padding:0 6px;font-size:11px;color:var(--muted)}
/* main */
.main{overflow:auto;min-width:0}
.inner{max-width:1080px;margin:0 auto;padding-block:26px 60px;padding-inline:28px}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0 0 12px;text-wrap:balance}
h3{font-size:15px;margin:0 0 6px}
.lead{color:var(--sub);margin:4px 0 22px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-family:var(--f-mono)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.muted{color:var(--muted);font-size:12px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub);white-space:nowrap;background:transparent}
button.chip:hover{color:var(--ink);border-color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--sub)}
.kind i{width:8px;height:8px;border-radius:2px;background:var(--k)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:7px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--sub)}
.btn:disabled{opacity:.5;cursor:wait}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{resize:vertical;min-height:72px}
label.l{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
/* hero */
.hero{border-radius:12px;padding:26px 26px 22px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 85% -20%,color-mix(in srgb,var(--c-paper) 30%,transparent),transparent 60%),radial-gradient(90% 120% at 0% 120%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),var(--surface)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.hero>*{position:relative}
.hero .q{font-family:var(--f-display);font-size:17px;margin-top:10px;color:var(--sub)}
/* bars */
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
table.prog{width:100%;border-collapse:collapse;font-size:13px}
table.prog td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.prog tr:last-child td{border:0}
table.prog td:first-child{width:72px;color:var(--sub)}
table.prog td:last-child{width:54px;text-align:right}
/* list (library) */
.lib{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:14px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.item:hover{background:var(--raised)}
.item.sel{background:var(--raised);box-shadow:inset 2px 0 0 var(--accent)}
.thumb{width:48px;height:56px;border-radius:5px;background:color-mix(in srgb,var(--k) 22%,var(--raised));border:1px solid color-mix(in srgb,var(--k) 40%,var(--line));display:flex;align-items:flex-end;padding:5px;font-family:var(--f-mono);font-size:10px;color:var(--sub)}
.item h3{font-size:15px;margin:0}
.item p{margin:2px 0 4px;color:var(--sub);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reader{position:sticky;top:0}
.reader .sum{font-size:14px;line-height:1.9}
.hlq{background:var(--hl);padding:2px 4px;border-radius:2px;line-height:2;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hls{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.points{padding-left:18px;margin:6px 0}
.points li{margin:3px 0}
.warn{font-size:12px;color:var(--sub);border-left:2px solid var(--c-news);padding-left:8px;margin:8px 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--sub);font-size:13px}
.tabs button.on{color:var(--ink);background:var(--raised);font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.drawer{border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--surface)}
/* university */
.course{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.course:hover{border-color:var(--sub)}
.lessons{list-style:none;padding:0;margin:8px 0}
.lessons li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.lessons li:last-child{border:0}
.ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;font-size:11px}
.ck.done{background:var(--good);border-color:var(--good);color:var(--bg)}
.lecture{font-size:14.5px;line-height:1.95}
.lecture h4{font-family:var(--f-display);font-size:17px;margin:18px 0 6px}
.quiz .opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:6px 0}
.quiz .opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.quiz .opt.ng{border-color:var(--c-news)}
/* research */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.stages span{font-size:11px;text-align:center;padding:2px 0;border-radius:4px;background:var(--line);color:var(--muted)}
.stages span.on{background:color-mix(in srgb,var(--accent) 80%,transparent);color:var(--accent-ink);font-weight:700}
.phase{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;margin:8px 0}
.phase b{font-size:12px;color:var(--accent);padding-top:8px}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%);box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* tutor */
.tutor{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;height:100%;padding-right:env(safe-area-inset-right,0px)}
.tutor header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.tutor header h2{margin:0;font-size:17px}
.modes{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.ctx{font-size:12px;color:var(--sub);margin-top:8px;display:flex;gap:6px;align-items:center}
.ctx b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:100%;font-size:13.5px;line-height:1.8;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--raised);border:1px solid var(--line);padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:88%}
.msg.ai{border-left:2px solid var(--accent);padding-left:10px}
.msg.sys{color:var(--muted);font-size:12px}
.msg .md p{margin:0 0 8px}.msg .md ul{margin:0 0 8px;padding-left:18px}
.compose{border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.compose textarea{min-height:42px;max-height:140px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.suggest .chip{white-space:normal;text-align:left}
.ctx .chip{flex:none}
.fab{display:none}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--sub);text-align:center}
.status{font-size:11px;color:var(--muted)}
@media (max-width:1180px){.app{grid-template-columns:72px minmax(0,1fr) 340px}.nav .lbl,.brand small,.nav .tagcloud,.nav .sep,.navfoot{display:none}.brand{font-size:13px;margin:0 0 14px;text-align:center}.nav a{justify-content:center}.lib{grid-template-columns:1fr}.reader{position:static}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100%}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .nav .lbl{display:inline}.brand{display:none}.nav a{padding:6px 10px;white-space:nowrap}
  .main{overflow:visible}
  .inner{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:18px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .tutor{position:fixed;inset:auto 0 0 0;height:78vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:20;transform:translateY(105%);transition:transform .25s;padding-left:env(safe-area-inset-left,0px)}
  .tutor.open{transform:none}
  .fab{display:flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:12px 18px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .tclose{display:inline-flex!important}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
}
.tclose{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="nav" aria-label="部屋">
    <div class="brand">For the Future Lab<small>KNOWLEDGE ROOM</small></div>
    <a href="#home" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">ホーム</span></a>
    <a href="#library" data-r="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 3 15.5-3.5 1z"/></svg><span class="lbl">知識の書庫</span></a>
    <a href="#university" data-r="university"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2.5 9 2.5 12 0v-5"/></svg><span class="lbl">画面の中の大学</span></a>
    <a href="#research" data-r="research"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg><span class="lbl">総合研究室</span></a>
    <a href="#observatory" data-r="observatory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span class="lbl">世界観測室</span></a>
    <div class="sep"></div>
    <div class="eyebrow" style="padding:0 6px 6px">タグ</div>

</div>
<button class="fab" id="fab">チューターに聞く</button>

<script>
/* ---------- 状態 ---------- */
const COLL=["library","courses","research","series","logs","visions"];
const S={library:[],courses:[],research:[],series:[],logs:[],visions:[]};
let db=null, sample=null, demo=false, loaded=false;
const UI={libKind:"all",libTag:null,sel:null,course:null,lesson:null,drawer:null,tutorCtx:null,mode:"explain",chat:[],busy:false};
const KINDS={paper:{n:"論文",c:"--c-paper"},news:{n:"ニュース",c:"--c-news"},encyclopedia:{n:"百科事典",c:"--c-ency"},note:{n:"メモ",c:"--c-note"}};
const STAGES=["仮説","調査","実験","結論"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https:\/\//.test(u||"")?u:"";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=p=>p+"-"+Math.random().toString(36).slice(2,9);
function md(t){ /* 最小限のMarkdown → HTML（先にエスケープ） */
  const lines=esc(t).split(/\n/);let out="",ul=false;
  for(const raw of lines){const l=raw.trim();
    if(/^[-・*]\s+/.test(l)){if(!ul){out+="<ul>";ul=true}out+="<li>"+inl(l.replace(/^[-・*]\s+/,""))+"</li>";continue}
    if(ul){out+="</ul>";ul=false}
    if(/^#{1,4}\s/.test(l))out+="<h4>"+inl(l.replace(/^#+\s/,""))+"</h4>";else if(l)out+="<p>"+inl(l)+"</p>";}
  if(ul)out+="</ul>";return out;
  function inl(s){return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
}

/* ---------- 保存（db があれば共有DB、なければこのブラウザ内のみ） ---------- */
async function put(coll,doc){
  const i=S[coll].findIndex(x=>x.id===doc.id);
  if(i>=0)S[coll][i]=doc;else S[coll].push(doc);
  render();
  if(db){try{const {id,...rest}=doc;await db.collection(coll).doc(id).set(rest);flash("保存しました")}catch(e){flash("保存できませんでした："+(e.message||e.code))}}
  else flash("プレビュー表示中のため、この変更は保存されません");
}
async function del(coll,id){S[coll]=S[coll].filter(x=>x.id!==id);render();if(db){try{await db.collection(coll).doc(id).delete();flash("削除しました")}catch(e){flash("削除できませんでした")}}}
let flashT;function flash(m){const el=$("#savestate");el.textContent=m;clearTimeout(flashT);flashT=setTimeout(()=>el.textContent=db?"クラウドに自動保存":"プレビュー表示中",3500)}

/* ---------- チャート（単系列の折れ線＋面、ホバーでツールチップ） ---------- */
function lineChart(el,s,{h=190,color="var(--c-paper)"}={}){
  const pts=s.points||[];if(!pts.length){el.innerHTML='<div class="empty">まだデータがありません。下から追加してね。</div>';return}
  const W=560,H=h,p={l:46,r:16,t:14,b:26};
  const vs=pts.map(x=>+x[1]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*.12;mn-=pad;mx+=pad;
  const xs=pts.map(q=>parseFloat(q[0])),num=xs.every(Number.isFinite)&&xs[xs.length-1]>xs[0];
  const X=i=>pts.length<2?p.l+(W-p.l-p.r)/2:p.l+(num?(xs[i]-xs[0])/(xs[xs.length-1]-xs[0]):i/(pts.length-1))*(W-p.l-p.r),Y=v=>p.t+(mx-v)*(H-p.t-p.b)/(mx-mn);
  const f=v=>Math.abs(mx)<10?v.toFixed(2):v.toFixed(0);
  let g="";for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3,y=Y(v);g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${f(v)}</text>`}
  const d=pts.map((q,i)=>`${i?"L":"M"}${X(i)},${Y(+q[1])}`).join("");
  const area=d+`L${X(pts.length-1)},${H-p.b}L${X(0)},${H-p.b}Z`;
  let lastLx=-99;const lab=pts.map((q,i)=>(X(i)-lastLx>=34&&(lastLx=X(i),true))?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${esc(q[0])}</text>`:"").join("");
  const last=pts.length-1;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.title)}の推移">${g}<path d="${area}" fill="${color}" opacity=".14"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${X(last)}" cy="${Y(+pts[last][1])}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
   <text x="${X(last)-8}" y="${Y(+pts[last][1])-10}" text-anchor="end" font-size="12" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${esc(pts[last][1])}${esc(s.unit)}</text>
   <line class="xh" x1="0" x2="0" y1="${p.t}" y2="${H-p.b}" stroke="var(--sub)" stroke-dasharray="3 3" visibility="hidden"/>
   <circle class="hd" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>${lab}
   <rect x="${p.l}" y="0" width="${W-p.l-p.r}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),xh=svg.querySelector(".xh"),hd=svg.querySelector(".hd");
  const move=ev=>{const r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width;let i=0;pts.forEach((_,k)=>{if(Math.abs(X(k)-x)<Math.abs(X(i)-x))i=k});
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("visibility","visible");hd.setAttribute("cx",X(i));hd.setAttribute("cy",Y(+pts[i][1]));hd.setAttribute("visibility","visible");
    tip.hidden=false;tip.textContent=`${pts[i][0]}年　${pts[i][1]}${s.unit||""}`;tip.style.left=(X(i)*r.width/W)+"px";tip.style.top=(Y(+pts[i][1])*r.height/H)+"px"};
  const out=()=>{tip.hidden=true;xh.setAttribute("visibility","hidden");hd.setAttribute("visibility","hidden")};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerleave",out);
}
function barChart(el,days){ /* 14日間の学習時間 */
  const W=560,H=150,p={l:34,r:8,t:10,b:24},mx=Math.max(60,...days.map(d=>d.m)),bw=(W-p.l-p.r)/days.length;
  let g="";[0,mx/2,mx].forEach(v=>{const y=p.t+(1-v/mx)*(H-p.t-p.b);g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${p.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${Math.round(v)}</text>`});
  const bars=days.map((d,i)=>{const h=(d.m/mx)*(H-p.t-p.b),x=p.l+i*bw+2,y=H-p.b-h;
    return `<g class="b" data-i="${i}">${d.m?`<path d="M${x},${H-p.b}V${y+4}q0,-4 4,-4h${bw-12}q4,0 4,4V${H-p.b}Z" fill="var(--accent)"/>`:""}<rect x="${p.l+i*bw}" y="${p.t}" width="${bw}" height="${H-p.t-p.b}" fill="transparent"/>
    ${(i%2===days.length%2||i===days.length-1)?`<text x="${x+(bw-4)/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${d.d.slice(8)}</text>`:""}</g>`}).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近14日の学習時間（分）">${g}${bars}</svg><div class="tip" hidden></div>`;
  const tip=el.querySelector(".tip"),svg=el.querySelector("svg");
  svg.querySelectorAll(".b").forEach(b=>{b.addEventListener("pointerenter",()=>{const i=+b.dataset.i,r=svg.getBoundingClientRect();tip.hidden=false;tip.textContent=`${days[i].d.slice(5).replace("-","/")}　${days[i].m}分`;tip.style.left=((p.l+i*bw+bw/2)*r.width/W)+"px";tip.style.top=((H-p.b-(days[i].m/mx)*(H-p.t-p.b))*r.height/H)+"px"});b.addEventListener("pointerleave",()=>tip.hidden=true)});
}

function streak(){const days=new Set(S.logs.map(l=>l.date));let n=0;const d=new Date();const key=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");if(!days.has(key(d)))d.setDate(d.getDate()-1);while(days.has(key(d))){n++;d.setDate(d.getDate()-1)}return n}

function stars(){const c=$("#stars");if(!c)return;const r=c.getBoundingClientRect(),x=c.getContext("2d");c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const col=getComputedStyle(document.documentElement).getPropertyValue("--sub");const pts=[];for(let i=0;i<46;i++)pts.push([((i*7919)%997)/997*r.width,((i*104729)%991)/991*r.height]);
  x.strokeStyle=col;x.fillStyle=col;x.globalAlpha=.25;pts.forEach((p,i)=>{const q=pts[(i*3+1)%pts.length];if(Math.hypot(p[0]-q[0],p[1]-q[1])<180){x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.stroke()}});
  x.globalAlpha=.6;pts.forEach((p,i)=>{x.beginPath();x.arc(p[0],p[1],i%5?1:2,0,7);x.fill()})}

    box.querySelectorAll(".opt").forEach(o=>o.addEventListener("click",()=>{const i=+o.dataset.qi,j=+o.dataset.ci,q=qs[i],wrap=box.querySelector(`[data-q="${i}"]`);if(wrap.dataset.done)return;wrap.dataset.done=1;answered++;
      const ok=j===+q.answer;if(ok)right++;o.classList.add(ok?"ok":"ng");wrap.querySelectorAll(".opt")[+q.answer]?.classList.add("ok");box.querySelector(`[data-why="${i}"]`).textContent=(ok?"正解！ ":"惜しい。 ")+(q.why||"");
      if(answered===qs.length){if(right===qs.length){c.done=[...new Set([...(c.done||[]),l.id])];put("courses",c);put("logs",{id:uid("g"),date:today(),minutes:25,course:c.id});flash("修了！学習記録に25分を追加しました")}else st.textContent=`${right}/${qs.length} 問正解。講義を読み直してもう一度挑戦しよう。`}}))
  }catch(e){st.textContent=errMsg(e)}finally{b.disabled=false}}
function errMsg(e){return e&&e.code==="not_granted"?"AIの利用が許可されていません。ページの権限設定から許可してね。":e&&e.code==="rate_limited"?"少し混み合っています。時間をおいて試してね。":"うまくいきませんでした："+(e&&e.message||e)}

/* ---------- チューター ---------- */
function ctxInfo(){const c=UI.tutorCtx;if(!c)return null;
  if(c.type==="item"){const x=S.library.find(y=>y.id===c.id);return x&&{label:"書庫｜"+x.title,text:`学習者が今読んでいる資料：「${x.title}」（${KINDS[x.kind].n}、${x.authors||""} ${x.year||""}）\n要約：${x.summary}\n要点：${(x.points||[]).join(" / ")}\nハイライト：${(x.highlights||[]).join(" / ")}\n学習者のメモ：${x.note||"なし"}`}}
  if(c.type==="lesson"){const co=S.courses.find(y=>y.id===c.c),l=co&&co.lessons.find(y=>y.id===c.l);return l&&{label:"大学｜"+l.title,text:`学習者が今受けている講義：講座「${co.title}」の「${l.title}」\n${l.lecture?"講義ノート：\n"+l.lecture.slice(0,3000):""}`}}
  if(c.type==="research"){const r=S.research.find(y=>y.id===c.id);return r&&{label:"研究室｜"+r.title,text:`学習者の研究テーマ「${r.title}」（ステージ：${r.stage}）\n仮説：${r.hypothesis}\n調査：${r.survey}\n実験：${r.experiment}\n結論：${r.conclusion}`}}
  if(c.type==="series"){const s=S.series.find(y=>y.id===c.id);return s&&{label:"観測室｜"+s.title,text:`指標「${s.title}」（${s.unit}、出典：${s.source}）：${s.points.map(p=>p[0]+"="+p[1]).join(", ")}`}}
  return null}
function setCtx(c){UI.tutorCtx=c;const i=ctxInfo();$("#ctx").innerHTML=i?`<span>いま見ている：</span><b>${esc(i.label)}</b><button class="chip" id="ctxX">外す</button>`:`<span>書庫全体をもとに答えるよ</span>`;suggestFor()}
function suggestFor(){const i=ctxInfo(),m=UI.mode;let s=[];
  if(i&&UI.tutorCtx.type==="item")s=["3行で要点を教えて","これが社会にどう役立つ？","関連して読むべきものは？"];
  else if(i&&UI.tutorCtx.type==="lesson")s=["もっと簡単に説明して","具体例をもう1つ","この先どう学べばいい？"];
  else s=["今日なにを学ぶといい？","書庫の知識をつなげて新しい問いを作って","最近の研究の流れを教えて"];
  if(m==="quiz")s=["この内容で1問出して","書庫からランダムに出題して"];
  $("#suggest").innerHTML=s.map(x=>`<button class="chip" data-sug="${esc(x)}">${esc(x)}</button>`).join("")}
$("#tutor").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.m){UI.mode=b.dataset.m;document.querySelectorAll("#modes .chip").forEach(x=>x.classList.toggle("on",x===b));suggestFor()}
  if(b.dataset.sug)ask(b.dataset.sug);
  if(b.id==="ctxX")setCtx(null);
  if(b.id==="tclose")closeTutorMobile();
  if(b.dataset.savenote!==undefined)saveAnswer(+b.dataset.savenote)});
$("#fab").onclick=openTutor;
function openTutor(){$("#tutor").classList.add("open");if(innerWidth>860)$("#tq").focus()}
function closeTutorMobile(){$("#tutor").classList.remove("open")}
$("#tq").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#compose").requestSubmit()}});
function drawChat(){const box=$("#msgs");
  if(!UI.chat.length){box.innerHTML=`<div class="msg sys">ここはあなた専用のチューター。書庫の資料や講義を開いたまま質問すると、その内容をふまえて答えるよ。答えは「書庫に保存」で知識として残せる。</div>`;return}
  box.innerHTML=UI.chat.map((m,i)=>m.role==="user"?`<div class="msg me">${esc(m.content)}</div>`:`<div class="msg ai"><div class="md">${md(m.content)||'<span class="muted">考えています…</span>'}</div>${m.done?`<button class="chip" data-savenote="${i}">書庫に保存</button>`:""}</div>`).join("");
  box.scrollTop=box.scrollHeight}
const MODE={explain:"やさしく、具体例を使って説明する。専門用語は言い換える。",socratic:"答えをすぐに言わず、学習者が自分で考えられるように問いかけで導く。1回の返答で問いは1〜2個。",quiz:"学習者の理解を確かめる問題を1問ずつ出し、答えが来たら採点して解説する。"};
async function ask(q){
  if(UI.busy)return;
  UI.chat.push({role:"user",content:q});const a={role:"assistant",content:"",done:false};UI.chat.push(a);drawChat();
  if(!sample){a.content="この表示ではチューターを使えません。claude.ai でこのページをひらくと話せるよ。";a.done=false;drawChat();return}
  UI.busy=true;$("#tsend").disabled=true;
  const i=ctxInfo();
  const sys=`あなたは学習者専用のチューターです。名前はつけず、フランクで落ち着いた日本語（タメ口）で話す。方針：${MODE[UI.mode]}
正確さを最優先し、不確かなことは「確かではない」と言う。最新の出来事については知識に期限があることを伝える。返答は300〜600字を目安に、見出しは使わず、必要なら箇条書き（- ）。
ツール search_library で学習者の書庫を検索でき、save_to_library で重要な解説を百科事典として保存できる（学習者が保存を頼んだときだけ使う）。
${i?"\n【いま開いている内容】\n"+i.text:""}`;
  const hist=[];UI.chat.slice(0,-1).filter(m=>m.content&&(m.role==="user"||m.done)).forEach(m=>{const l=hist[hist.length-1];if(l&&l.role===m.role)l.content+="\n"+m.content;else hist.push({role:m.role,content:m.content})});
  while(hist.length>10||(hist.length&&hist[0].role!=="user"))hist.shift();
  const msgs=[{role:"user",content:sys+"\n\n---\n"+hist[0].content},...hist.slice(1)];
  try{const r=await sample(msgs,{modelTier:"default",cache:false,onText:({text})=>{a.content=text;drawChat()},tools:[
      {name:"search_library",description:"学習者の知識の書庫（論文・ニュース・百科事典・メモ）をキーワードで検索する",inputSchema:{type:"object",properties:{query:{type:"string"}},required:["query"]},
       execute:({query})=>{const q=String(query||"").toLowerCase();return S.library.filter(x=>(x.title+x.summary+(x.tags||[]).join(" ")).toLowerCase().includes(q)).slice(0,5).map(x=>({title:x.title,kind:KINDS[x.kind].n,year:x.year,summary:x.summary.slice(0,300)}))}},
      {name:"save_to_library",description:"解説を百科事典の項目として学習者の書庫に保存する",inputSchema:{type:"object",properties:{title:{type:"string"},summary:{type:"string"},tags:{type:"array",items:{type:"string"}}},required:["title","summary"]},
       execute:({title,summary,tags})=>{put("library",{id:uid("e"),kind:"encyclopedia",title:String(title),authors:"チューター",year:new Date().getFullYear(),venue:"百科事典",url:"",tags:(tags||[]).map(String).slice(0,4),summary:String(summary),points:[],highlights:[],note:"",status:"later",added:today(),source:"チューターとの対話から保存"});return {saved:true}}}
    ]});
    a.content=r.text;a.done=true}catch(e){a.content=errMsg(e)}finally{UI.busy=false;$("#tsend").disabled=false;drawChat()}}
function saveAnswer(i){const a=UI.chat[i],q=UI.chat[i-1];if(!a)return;
  put("library",{id:uid("m"),kind:"note",title:(q?q.content:"チューターの解説").slice(0,40),authors:"チューター",year:new Date().getFullYear(),venue:"対話メモ",url:"",tags:[],summary:a.content.slice(0,4000),points:[],highlights:[],note:"",status:"later",added:today(),source:"チューターとの対話から保存"});
  flash("書庫のメモに保存しました")}

/* ---------- 起動 ---------- */
async function boot(){
  render();drawChat();
  const timer=setTimeout(()=>{if(!loaded)loadDemo()},10000);
  const [d,sm]=await Promise.all([window.claude?.use?.("db")??null,window.claude?.use?.("sample")??null].map(p=>Promise.resolve(p).catch(()=>null)));
  sample=sm;db=d;
  if(!db){clearTimeout(timer);return loadDemo()}
  let got=0;
  COLL.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(x=>({id:x.id,...x.data()}));if(!loaded&&++got>=COLL.length){loaded=true;clearTimeout(timer);flash("クラウドに自動保存")}if(loaded)render()},
    e=>{clearTimeout(timer);flash("データを読み込めませんでした："+(e.message||e.code))}));
}
async function loadDemo(){demo=true;try{const r=await fetch("seed.json");const j=await r.json();COLL.forEach(c=>S[c]=j[c]||[])}catch(e){}loaded=true;flash("プレビュー表示中（サンプルデータ）");render()}
boot();
</script>
