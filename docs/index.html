<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Future Lab">
<title>For the Future Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23233a5e'/%3E%3Ccircle cx='22' cy='24' r='5' fill='%23f2c14e'/%3E%3Ccircle cx='42' cy='20' r='4' fill='%23fff'/%3E%3Ccircle cx='38' cy='42' r='6' fill='%23fff'/%3E%3Cpath d='M22 24L42 20M22 24L38 42M42 20L38 42' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* Layout: 左にワークスペースの木、右に開いているもの。スマホでは木が引き出しになる */
:root{
  --bg:#f6f6f3; --panel:#ffffff; --side:#efefea; --line:#e1e0d9; --ink:#1f2125; --sub:#5d606a; --muted:#8a8d96;
  --accent:#2f5bd3; --accent-soft:#e6ecfb; --hl:#fff3c4; --danger:#c2412d;
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181d; --panel:#1d2027; --side:#191c22; --line:#2c3039; --ink:#e8e9ec; --sub:#a9adb7; --muted:#7c818c;
  --accent:#7c9cff; --accent-soft:#252f4a; --hl:#4a3f17; --danger:#ff8a75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --panel:#1d2027; --side:#191c22; --line:#2c3039; --ink:#e8e9ec; --sub:#a9adb7; --muted:#7c818c;
  --accent:#7c9cff; --accent-soft:#252f4a; --hl:#4a3f17; --danger:#ff8a75; color-scheme:dark}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--f-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.side-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.ws{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-scroll{overflow:auto;flex:1;padding:4px 8px 16px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:6px;color:var(--sub);text-decoration:none;font-size:14px;min-height:34px}
.nav-item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.nav-item.on{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink);font-weight:600}
.nav-item .ic{width:20px;text-align:center;flex:none}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);padding:14px 8px 4px;letter-spacing:.04em}
.side-label button{color:var(--muted);font-size:18px;line-height:1;width:26px;height:26px;border-radius:5px}
.side-label button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#3aa76d}.dot.err{background:var(--danger)}
/* main */
.main{overflow:auto;min-width:0;padding-top:env(safe-area-inset-top,0px)}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 16px;border-bottom:1px solid transparent}
.crumbs{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--sub);text-decoration:none}
.iconbtn{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--sub);flex:none}
.iconbtn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.menu-btn{display:none}
.page{max-width:920px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.page.wide{max-width:none}
h1{font-size:30px;line-height:1.3;margin:6px 0 4px;letter-spacing:.01em}
h2{font-size:18px;margin:28px 0 10px}
.lead{color:var(--sub);margin:0 0 18px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;white-space:nowrap;min-height:36px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--sub)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--muted)) 16%,transparent);color:var(--ink);white-space:nowrap;line-height:1.7}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--sub)}
.capture{display:flex;gap:8px;margin:6px 0 4px}
.capture input{font-size:16px;padding:10px 12px;background:var(--panel)}
.tplgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tpl{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tpl:hover{border-color:var(--accent)}
.tpl b{display:block}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list-row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.list-row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* type view */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 12px;overflow-x:auto}
.tabs button{padding:7px 12px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{max-width:240px}
.toolbar select{width:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.db{border-collapse:collapse;width:100%;font-size:14px}
table.db th,table.db td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.db th{font-weight:600;color:var(--sub);font-size:12px;background:color-mix(in srgb,var(--ink) 3%,transparent);cursor:pointer;user-select:none}
table.db tr:last-child td{border-bottom:0}
table.db td.title a{color:var(--ink);font-weight:600;text-decoration:none}
table.db tbody tr:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.cards a{color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:6px}
.cards a:hover{border-color:var(--accent)}
.excerpt{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 260px;background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:var(--r);padding:8px}
.col h3{font-size:13px;margin:2px 4px 8px;display:flex;gap:6px;align-items:center}
.col .card{display:block;margin-bottom:8px;color:var(--ink);text-decoration:none;padding:10px 12px}
/* item */
.title-input{font-size:30px;font-weight:700;border:0;padding:4px 0;line-height:1.3;background:transparent}
.title-input:focus{outline:none}
.props{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;margin:10px 0 18px;align-items:start}
.props .k{color:var(--sub);font-size:13px;padding-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.props input,.props select{border-color:transparent;background:transparent}
.props input:hover,.props select:hover{border-color:var(--line)}
.multi{display:flex;flex-wrap:wrap;gap:4px;padding:5px 0}
.multi label{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;cursor:pointer}
.multi input{width:auto}
.stars button{font-size:20px;color:var(--muted);padding:0 2px}.stars button.on{color:#e0a400}
.editor-tabs{display:flex;gap:4px;margin-bottom:6px}
.editor-tabs button{font-size:13px;padding:3px 10px;border-radius:6px;color:var(--sub)}
.editor-tabs button.on{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
textarea.body{min-height:46vh;font-size:16px;line-height:1.8;border:1px solid var(--line);background:var(--panel);padding:14px 16px;resize:vertical}
.md{font-size:16px;line-height:1.9;overflow-wrap:anywhere}
.md h1{font-size:24px}.md h2{font-size:20px;margin:22px 0 8px}.md h3{font-size:17px}
.md code{font-family:var(--f-mono);font-size:.9em;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:1px 5px;border-radius:4px}
.md blockquote{margin:8px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--sub)}
.md mark{background:var(--hl);color:inherit;padding:0 2px}
.md a.wl{text-decoration:none;border-bottom:1px dashed var(--accent)}
.md a.wl.missing{color:var(--muted);border-bottom-color:var(--muted)}
.md ul,.md ol{padding-left:22px}
.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--line);padding:4px 8px}
.backlinks{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
/* dialogs / palette */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(10vh,env(safe-area-inset-top,0px)) 16px 16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:80vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dialog header h2{margin:0;font-size:17px;flex:1}
.dialog .body-pad{padding:14px 18px}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.palette input{font-size:17px;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 18px}
.palette input:focus{outline:none}
.palette .res{padding:6px}
.palette .res a{display:flex;gap:10px;padding:9px 12px;border-radius:7px;color:var(--ink);text-decoration:none;align-items:center}
.palette .res a.sel,.palette .res a:hover{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* login */
.login{max-width:420px;margin:12vh auto;padding:0 16px}
/* mobile */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  .menu-btn{display:grid}
  .props{grid-template-columns:110px minmax(0,1fr)}
  h1,.title-input{font-size:25px}
  .field-row{grid-template-columns:minmax(0,1fr) 120px auto}
  input,textarea,select{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
